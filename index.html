<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07140f">
<title>Pik Ekrok — Compagnon de combat</title>
<style>
html,body{margin:0;min-height:100%;background:#07100c;color:#f4f7f2;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#1f6f4b55,transparent 35rem),radial-gradient(circle at 90% 80%,#8f26313a 0,transparent 30rem),#07100c}.boot div{text-align:center}.cross{font-size:64px;color:#ed5c61;text-shadow:0 0 28px #ed5c6166}.boot p{color:#aebbb3}
</style>
</head>
<body>
<div class="boot"><div><div class="cross">✚</div><h1>Pik Ekrok</h1><p>Chargement du compagnon médical…</p></div></div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/bryantoualy-del/Pik/9b36eebfd2cb215293fb1a067b0ea80e0d7dae82/index.html';
    const [baseRes,socialRes]=await Promise.all([fetch(base,{cache:'no-store'}),fetch('social.js?v=3',{cache:'no-store'})]);
    let html=await baseRes.text();
    const socialCode=await socialRes.text();
    html=html.replaceAll('Pik Sang Froid','Pik Ekrok').replaceAll('Sang Froid','Ekrok');
    html=html.replace('<meta name="theme-color" content="#0d1110">','<meta name="theme-color" content="#07140f">');
    html=html.replace('</head>','<link rel="stylesheet" href="medical.css?v=4"><link rel="stylesheet" href="medical-fx.css?v=3"><link rel="stylesheet" href="dice-engine.css?v=2"></head>');
    const bootMarker='renderNav();renderAll();';
    const bootIndex=html.lastIndexOf(bootMarker);
    if(bootIndex<0) throw new Error('Point d’injection Social introuvable');
    html=html.slice(0,bootIndex)+socialCode+'\n'+html.slice(bootIndex);
    html=html.replace('</body>','<script src="medical-fx.js?v=3"><\/script><script type="module" src="dice-engine.js?v=2"><\/script><script src="signature-icon.js?v=20"><\/script><script src="action-availability.js?v=2"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><div><div class="cross">✚</div><h1>Pik Ekrok</h1><p>Impossible de charger le compagnon. Recharge la page.</p></div></div>';
  }
})();
</script>
</body>
</html>
